name: amp

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  amp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Check against complete pinned Amp API (no login)
        run: npm --prefix amp run typecheck
      - name: Unit, simulated contract and artifact lifecycle tests
        run: npm --prefix amp test
      - name: Build reproducible distribution
        run: node amp/scripts/build.mjs "$RUNNER_TEMP/amp-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ponytail-amp-experimental
          path: ${{ runner.temp }}/amp-dist/*
          if-no-files-found: error
